name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK (preinstalled on runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Fetch sherpa-onnx (on-device speech recognition)
        run: curl -fsSL -o app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
      - name: Signing key (optional secrets)
        env: { KEYSTORE_B64: '${{ secrets.KEYSTORE_B64 }}' }
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.jks; echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV; fi
      - name: Unit tests + build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon testReleaseUnitTest assembleRelease -PmodelBaseUrl=https://github.com/${{ github.repository }}/releases/download/models-v1/ 2>&1 | tee build.log || { grep -E '^e: |FAILED|AssertionError|expected:|Exception|What went wrong' -A2 build.log | head -60 > err.txt; echo "::error::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' err.txt)"; exit 1; }
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk TabrizCaptions.apk
      - uses: actions/upload-artifact@v4
        with: { name: TabrizCaptions-apk, path: TabrizCaptions.apk }
      - name: Publish to the "latest" release (download link for phones)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "Latest APK" --notes "آخرین نسخه اپ کپشن تبریز. روی TabrizCaptions.apk بزن و نصب کن."
          gh release upload apk-latest TabrizCaptions.apk --clobber
